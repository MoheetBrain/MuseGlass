[project]
name = "museglass"
version = "0.1.0"
description = "Hands-free voice interface between Meta AI glasses and a coding agent (Muse Code first) running on your Mac."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Backends
claude = ["claude-agent-sdk>=0.2"]
# Local speech on Apple Silicon (mlx-whisper) + VAD endpointing
speech = ["mlx-whisper>=0.4", "webrtcvad-wheels>=2.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[project.scripts]
museglass = "museglass.apps.desktop_demo:main"
museglass-console = "museglass.apps.desktop_demo:main_console"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["museglass*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests that run the demo repository's real test suite",
    "muse_live: requires an installed, signed-in `muse` binary",
    "claude_live: requires a signed-in Claude Code CLI",
]
